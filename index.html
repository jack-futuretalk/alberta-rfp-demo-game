<!DOCTYPE html>
<html lang="en" data-theme="instagram">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Advertisement Claim Checker, spot claims in food and wellness ads." />
    <title>Advertisement Claim Checker</title>
    <script>
      // GitHub Pages project sites need a trailing slash or relative assets 404.
      (function () {
        var path = location.pathname;
        if (path.slice(-1) !== "/" && !/\.[a-zA-Z0-9]+$/.test(path)) {
          location.replace(path + "/" + location.search + location.hash);
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Libre+Baskerville:wght@700&family=Nunito:wght@400;600;700&family=Oswald:wght@600;700&family=Outfit:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/themes.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to game</a>

    <div class="page-bg" aria-hidden="true"></div>

    <header class="site-header">
      <p class="brand">Advertisement Claim Checker</p>
      <div class="header-tools">
        <p class="brand-sub" id="header-progress" hidden></p>
        <div id="theme-switcher"></div>
      </div>
    </header>

    <main id="app" class="app" tabindex="-1">
      <p class="loading" id="loading">Loading…</p>
    </main>

    <footer class="site-footer">
      <p>No login · No personal data collected · Draft demo build · Switch looks anytime in the header</p>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
